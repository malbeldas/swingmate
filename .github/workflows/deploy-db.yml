# Deploy de la base y las Edge Functions a Supabase (infrastructure.md §6). Manual: Actions →
# "Deploy de base y funciones" → Run workflow. Corre solo sobre main con CI en verde.
#
# Secrets del repo (Settings → Secrets and variables → Actions), los carga Maxi una sola vez:
#   SUPABASE_ACCESS_TOKEN  token personal de supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   contraseña de la base del proyecto
#   SUPABASE_PROJECT_REF   el id del proyecto (lo que va en <ref>.supabase.co)
#
# No corre seed.sql (BR-TRU-006) ni `supabase config push`: supabase/config.toml es la
# configuración local y de CI (site_url local, números de prueba, sin captcha), y subirla pisaría
# la de Auth del proyecto. Esa se cambia en el dashboard.
name: Deploy de base y funciones

on:
  workflow_dispatch:
    inputs:
      solo_ver:
        description: 'Solo mostrar qué migraciones faltan, sin aplicar nada'
        type: boolean
        default: true
      funciones:
        description: 'Deployar también las Edge Functions'
        type: boolean
        default: true
      confirmar:
        description: 'Para aplicar, escribí deploy'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a Supabase
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Solo desde main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::El deploy corre solo desde main."
          exit 1
      - name: Faltan secrets
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_DB_PASSWORD == '' || env.PROJECT_REF == ''
        run: |
          echo "::error::Faltan SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD o SUPABASE_PROJECT_REF en los secrets del repo."
          exit 1
      - name: Confirmación
        if: ${{ !inputs.solo_ver && inputs.confirmar != 'deploy' }}
        run: |
          echo "::error::Para aplicar hay que escribir deploy en 'confirmar'. Para solo mirar, dejá tildado 'solo mostrar'."
          exit 1
      # infrastructure.md §6: CI en verde en main antes de cada deploy.
      - name: CI en verde para este commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" --jq '.total_count')
          if [ "$ok" = "0" ]; then
            echo "::error::El CI de este commit de main no está en verde (o no terminó). Esperá a que pase y volvé a correr."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migraciones que faltan
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        if: ${{ !inputs.solo_ver }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deployar Edge Functions
        if: ${{ !inputs.solo_ver && inputs.funciones }}
        run: supabase functions deploy --project-ref "$PROJECT_REF"
