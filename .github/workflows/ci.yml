name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Tests unitarios y consistencia de specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  db:
    name: Tests de base (pgTAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # engineering-constitution.md §2: CLI version pinned in CI.
          version: 2.122.1
      - run: supabase db start
      - run: supabase test db

  e2e:
    name: Tests de pantalla (Playwright)
    # Fijo en 24.04: Playwright 1.56 no instala Chromium en ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The runner image already has Chromium's system libraries. Extra packages
      # (fonts) come from security.ubuntu.com; if that host is down, carry on
      # with a warning instead of failing before any test runs.
      - run: npx playwright install chromium
      - run: timeout 300 npx playwright install-deps chromium || echo "::warning::playwright install-deps failed; using the runner's own libraries"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      # Auth, REST, Realtime (AC-033-1), Mailpit and the Edge Functions (phone-verify, AC-021-2) are
      # what the E2E use; the rest stays off to start faster.
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor,postgres-meta
      - run: npm run local:config
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 7
